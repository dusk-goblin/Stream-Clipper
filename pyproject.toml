[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stream-clipper"
version = "0.1.0"
description = "Record a Twitch live stream and cut it into topic-segmented clips."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "PyYAML>=6.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
# Live capture: Twitch HLS pull. ffmpeg must be on PATH separately.
capture = ["streamlink>=6.7"]
# Transcription. Install a CUDA-enabled torch separately for GPU.
whisper = ["faster-whisper>=1.0"]
# Semantic drift boundaries. Without this the TF-IDF fallback backend is used.
embeddings = ["sentence-transformers>=2.7"]
# LLM boundary/label/clippability pass. Without this those stages degrade.
llm = ["anthropic>=1.0"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]
all = [
    "streamlink>=6.7",
    "faster-whisper>=1.0",
    "sentence-transformers>=2.7",
    "anthropic>=1.0",
]

[project.scripts]
stream-clipper = "streamclipper.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
streamclipper = ["py.typed", "resources/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]
