# Example user config. Only the keys you want to change need to be here --
# everything else falls back to the packaged defaults
# (src/streamclipper/resources/default.yaml, which lists every option).
#
#   stream-clipper -c config/example.yaml record

channel: hasanabi

paths:
  data_dir: ./data

capture:
  quality: 720p60          # "best" is source quality and a lot of disk
  segment_seconds: 300

transcribe:
  model: distil-large-v3   # a good speed/accuracy trade-off on GPU
  device: auto

segment:
  min_topic_seconds: 240
  max_topic_seconds: 1800
  semantic:
    similarity_threshold: 0.55
    depth_threshold: 0.12

highlight:
  clip_min_seconds: 30
  clip_max_seconds: 75
  per_topic: 2
  weights:
    chat_rate: 0.35
    emote_spike: 0.25
    llm: 0.40

clips:
  mode: auto
  pad_before: 2.0
  pad_after: 1.5
  burn_subtitles: false
  vertical:
    enabled: false

llm:
  model: claude-opus-5
  effort: medium

retention:
  delete_segments_after_clip: false
  max_disk_gb: 200

logging:
  level: INFO
  format: text
